name: MBF Tagged Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck (-S warning)
        run: |
          for f in framework.sh bin/mbf lib/*.sh plugins/*.sh tools/*.sh install.sh; do
            shellcheck -S warning "$f"
          done

      - name: Run MBF Test Suite
        run: bash test/run.sh

      - name: Package Release Tarball & SHA-256 Checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="mbf-${TAG}/" -o "dist/mbf-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum "mbf-${TAG}.tar.gz" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating release assets..."
            gh release upload "$TAG" \
              "dist/mbf-${TAG}.tar.gz" \
              "dist/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/mbf-${TAG}.tar.gz" \
              "dist/SHA256SUMS.txt" \
              --title "MBF ${TAG}" \
              --generate-notes
          fi
