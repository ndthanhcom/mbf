name: MBF Automated Tests & Portability Matrix

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on framework, CLI, libraries, plugins & tools
        run: |
          shellcheck --version
          shellcheck -x framework.sh bin/mbf lib/*.sh plugins/*.sh tools/*.sh install.sh

  linux-and-macos:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure modern Bash & ShellCheck on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
      - name: Print environment info
        run: |
          bash --version | head -n 2
          awk --version 2>/dev/null | head -n 1 || true
      - name: Run mbf test suite (standard + strict mode)
        run: bash test/run.sh

  bash-4-4-minimum:
    name: Test Suite (Bash 4.4 / Alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: bash:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal runtime tools in Alpine container
        run: apk add --no-cache git openssl
      - name: Print environment info
        run: bash --version | head -n 2
      - name: Run mbf test suite on Bash 4.4
        run: bash test/run.sh
