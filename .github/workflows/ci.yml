name: MBF Automated Tests & Portability Matrix

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  linux-and-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure modern Bash & ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install bash shellcheck
      - name: Run mbf test suite (standard + strict mode)
        run: bash test/run.sh

  bash-4-4-minimum:
    runs-on: ubuntu-latest
    container:
      image: bash:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Run mbf test suite on Bash 4.4
        run: bash test/run.sh
